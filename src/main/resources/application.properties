spring.application.name=quotaguard
spring.datasource.url=jdbc:postgresql://localhost:5432/quotaguard
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.data-source-properties.options=-c TimeZone=Asia/Kolkata
spring.data.redis.host=localhost
spring.data.redis.port=6379
quotaguard.limiter=redis
# Fail fast when Redis is down: Lettuce's default command timeout is 60 s.
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
# Redis unreachable: true = keep serving without limits (fail open), false = 503 (fail closed)
quotaguard.fail-open=true
